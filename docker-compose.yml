services:
  postgres:
    image: postgres:17-alpine
    container_name: bank-account-postgres
    environment:
      POSTGRES_DB: bank_account
      POSTGRES_USER: bank_account
      POSTGRES_PASSWORD: bank_account
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
