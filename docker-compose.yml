services:
  postgres:
    image: postgres:18
    container_name: bank-account-postgres
    environment:
      POSTGRES_DB: bank_account
      POSTGRES_USER: bank_account
      POSTGRES_PASSWORD: bank_account
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_account -d bank_account"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: bank-account-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank_account
      SPRING_DATASOURCE_USERNAME: bank_account
      SPRING_DATASOURCE_PASSWORD: bank_account
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
