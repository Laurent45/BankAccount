spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bank_account}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bank_account}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bank_account}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql

spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1
